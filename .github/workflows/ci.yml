name: StockWise-AI Security & CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-security:
    name: Unit Tests & Security Verification
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Test Suite (8+ Unit & Security Tests)
      run: |
        python stock_advisor/test_stock.py

    - name: Verify Code Syntax and Import Integrity
      run: |
        python -c "import stock_advisor.app; import stock_advisor.security; print('All core modules validated successfully!')"
